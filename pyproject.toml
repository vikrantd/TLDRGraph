[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tldrgraph"
version = "0.1.0"
description = "See the flow of your spaghetti code, VibeCoders. Instant multi-layer architecture & semantic call tracing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "tabulate>=0.9.0",
    "graphifyy>=0.9.0",
]

[project.optional-dependencies]
# Dense (ONNX) retrieval. OPTIONAL on purpose: it pulls onnxruntime and needs a
# ~67 MB model download, and TLDRGraph must stay fully usable on TF-IDF alone.
# Nothing in the default install path imports these.
embeddings = [
    "fastembed>=0.3",
    "numpy>=1.24",
]

[project.scripts]
tldrgraph = "tldrgraph.cli:main"
codechakra = "tldrgraph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tldrgraph*"]

[tool.setuptools.package-data]
"tldrgraph.visualizer" = ["assets/*.html", "assets/*.css", "assets/*.js"]
