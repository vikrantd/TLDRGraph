[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codechakra"
version = "0.1.0"
description = "Token-Efficient Hybrid Code Flow & Semantic Navigation Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# Dense (ONNX) retrieval. OPTIONAL on purpose: it pulls onnxruntime and needs a
# ~67 MB model download, and CodeChakra must stay fully usable on TF-IDF alone.
# Nothing in the default install path imports these.
embeddings = [
    "fastembed>=0.3",
    "numpy>=1.24",
]

[project.scripts]
codechakra = "codechakra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codechakra*"]

[tool.setuptools.package-data]
"codechakra.visualizer" = ["assets/*.html", "assets/*.css", "assets/*.js"]
