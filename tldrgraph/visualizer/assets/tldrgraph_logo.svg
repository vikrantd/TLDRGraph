<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Neon Line Gradients -->
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="flow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="800" rx="60" fill="url(#bg-glow)" />

  <!-- Subtle Ambient Constellation Grid in Background -->
  <g stroke="rgba(56, 189, 248, 0.05)" stroke-width="1">
    <line x1="80" y1="80" x2="240" y2="160" />
    <line x1="240" y1="160" x2="180" y2="320" />
    <line x1="640" y1="120" x2="720" y2="240" />
    <line x1="720" y1="240" x2="600" y2="340" />
    <line x1="120" y1="680" x2="260" y2="600" />
    <line x1="680" y1="620" x2="580" y2="720" />
  </g>

  <!-- MAIN GRAPH & SPAGHETTI EMBLEM -->
  <g filter="url(#glow)">

    <!-- === LEFT: TANGLED SPAGHETTI CODE THREADS === -->
    <!-- Purple/Pink Wild Loops -->
    <path d="M 220 200 C 140 210, 110 320, 200 340 C 270 360, 290 240, 210 260 C 130 280, 160 440, 260 410 C 330 390, 360 460, 250 480 C 150 500, 120 380, 190 320 C 230 280, 340 310, 370 350" 
          fill="none" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />

    <path d="M 280 180 C 160 160, 120 280, 230 300 C 310 320, 330 200, 220 230 C 150 250, 130 400, 240 430 C 310 450, 340 360, 300 320 C 250 270, 180 340, 170 420 C 160 480, 280 490, 360 400" 
          fill="none" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

    <!-- Cyan/Blue Tangled Loops -->
    <path d="M 200 160 C 290 140, 340 250, 260 290 C 180 330, 140 220, 220 190 C 300 160, 330 330, 230 370 C 130 410, 180 520, 310 470 C 380 440, 330 350, 380 370" 
          fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

    <path d="M 250 220 C 170 240, 150 360, 240 370 C 320 380, 310 270, 230 290 C 160 310, 170 460, 290 440 C 350 430, 360 360, 390 370" 
          fill="none" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />


    <!-- === CONVERGENCE / TRANSITION CHANNELS (Spaghetti -> Straight Lines) === -->
    <path d="M 360 300 C 390 300, 420 250, 470 250" fill="none" stroke="url(#flow-gradient)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 370 330 C 400 330, 420 300, 470 300" fill="none" stroke="url(#flow-gradient)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 380 370 C 410 370, 430 370, 470 370" fill="none" stroke="url(#flow-gradient)" stroke-width="5" stroke-linecap="round" />
    <path d="M 370 410 C 400 410, 420 440, 470 440" fill="none" stroke="url(#flow-gradient)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 360 440 C 390 440, 420 490, 470 490" fill="none" stroke="url(#flow-gradient)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Central Fast-Forward Flow Arrow Marker -->
    <polygon points="425,355 450,370 425,385" fill="#06b6d4" />


    <!-- === RIGHT: CLEAN MULTI-LAYER ARCHITECTURAL GRAPH === -->

    <!-- Outer Circuit Ring Buses -->
    <path d="M 470 250 L 580 250 L 640 310 L 640 430 L 580 490 L 470 490" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 470 300 L 550 300 L 590 340 L 590 400 L 550 440 L 470 440" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linejoin="round" />
    <path d="M 470 370 L 570 370" fill="none" stroke="#38bdf8" stroke-width="4" />

    <!-- Cross-Layer Interconnections -->
    <line x1="510" y1="250" x2="510" y2="490" stroke="#8b5cf6" stroke-width="3.5" stroke-dasharray="6 4" />
    <line x1="550" y1="300" x2="550" y2="440" stroke="#38bdf8" stroke-width="3.5" />
    <line x1="640" y1="370" x2="690" y2="370" stroke="#10b981" stroke-width="4.5" />

    <!-- Structured Architectural Layer Nodes (Boxes, Diamonds, Circles) -->
    <!-- Top Layer (API / Gateway) -->
    <rect x="495" y="235" width="30" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <rect x="565" y="235" width="30" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="4" />

    <!-- Middle Layer (Services / Logic) -->
    <rect x="455" y="285" width="30" height="30" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="4" />
    <rect x="535" y="285" width="30" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <rect x="500" y="355" width="32" height="32" rx="7" fill="#1e293b" stroke="#00f5d4" stroke-width="4.5" />
    <circle cx="590" cy="370" r="12" fill="#0f172a" stroke="#10b981" stroke-width="4" />

    <!-- Core Persistence & Output Layer -->
    <rect x="455" y="425" width="30" height="30" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="4" />
    <rect x="535" y="425" width="30" height="30" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="4" />
    <rect x="495" y="475" width="30" height="30" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="4" />
    <rect x="565" y="475" width="30" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="4" />

    <!-- Outbound Final Node -->
    <circle cx="690" cy="370" r="14" fill="#064e3b" stroke="#10b981" stroke-width="4.5" />
  </g>

  <!-- === TYPOGRAPHY === -->
  <g text-anchor="middle">
    <!-- TLDR in bold cyber cyan glow -->
    <text x="400" y="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#text-grad)" filter="url(#subtle-glow)">
      TLDR<tspan fill="#ffffff" font-weight="400">Graph</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="685" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" letter-spacing="2" fill="#94a3b8">
      SPAGHETTI CODE  ➔  CLEAN FLOW
    </text>
  </g>
</svg>
