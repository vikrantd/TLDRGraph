version: 1
utility_id: utility
layers:
- id: cli
  name: 'Layer 1: CLI & Commands'
  order: 1
  description: Command line interface, argument parsing, options, and commands
  rules:
  - file_contains:
    - cli.py
    - /cli/
    - commands/
    - cmd/
    - bin/
  - file_contains:
    - cli
    exclude_file:
    - flow_engine
    - vector_store
    - graph_loader
    - classifier
  - label_contains:
    - cli_command
    - cli_main
    - main_cli
    - subcommand
- id: engine
  name: 'Layer 2: Core Flow Engine & Logic'
  order: 2
  description: Core algorithms, flow traversal, analysis, classification, and extractors
  rules:
  - file_contains:
    - flow_engine
    - classifier
    - extractors
    - deadcode
    - propose_layers
    - hierarchy
    - engine
  - label_contains:
    - engine
    - flow
    - classify
    - extract
    - traverse
    - walk
    - rule
- id: storage
  name: 'Layer 3: Graph Loader, Storage & Index'
  order: 3
  description: Graph ingestion, SQLite caching, hash gating, vector store, and configuration
  rules:
  - file_contains:
    - graph_loader
    - hash_gate
    - vector_store
    - layer_config
    - layers
    - rules
  - label_contains:
    - loader
    - graph
    - store
    - cache
    - gate
    - config
    - registry
- id: integrations
  name: 'Layer 4: Agent Loop & Visualizer'
  order: 4
  description: Host-agent rules installer, LLM enrichment providers, and HTML visualizer
  rules:
  - file_contains:
    - installer
    - llm_enricher
    - visualizer
  - label_contains:
    - installer
    - visualizer
    - enricher
    - agent
- id: utility
  name: General / Utility
  order: 5
  description: Shared utility helpers, formatting, and common routines
